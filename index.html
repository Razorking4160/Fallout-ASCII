<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fallout ASCII</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#040904">
<meta name="color-scheme" content="dark">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fallout ASCII">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/terminal.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<div id="app">
  <div id="play">
  <div id="bar"></div>
  <div id="updatebar" hidden><span id="updatetext">A new build is ready.</span><button id="updatebtn">Reload</button></div>
  <div id="modalback" hidden></div>
  <div id="menu" hidden></div>
  <div id="pip" hidden></div>
  <div id="chargen" hidden></div>
  <div id="crt"><div id="screen"></div><canvas id="weather" aria-hidden="true"></canvas></div>
  <div id="log"></div>
  <div id="vats" hidden></div>
  <div id="dlg" hidden></div>
  <div id="trade" hidden></div>
  <div id="pick" hidden></div>
  <div id="loot" hidden></div>
  <div id="lock" hidden></div>
  <div id="hack" hidden></div>
  <div id="gamble" hidden></div>
  <div id="ending" hidden></div>
  <div id="death" hidden></div>
  <div id="pad">
    <button class="small" data-k="vats" id="vatsbtn">VATS</button>
    <button data-d="0,-1" aria-label="Up">▲</button>
    <button class="small" data-k="pip">Pip-Boy</button>
    <button data-d="-1,0" aria-label="Left">◀</button>
    <button class="small" data-k="wait">Wait</button>
    <button data-d="1,0" aria-label="Right">▶</button>
    <button class="small" data-k="fire" id="firebtn">Fire</button>
    <button data-d="0,1" aria-label="Down">▼</button>
    <button class="small" data-k="throw" id="throwbtn">Throw</button>
  </div>
  </div>
  </div>
